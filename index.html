<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0f1020" />
    <title>Salut — l'app qui dit bonjour</title>
    <meta
      name="description"
      content="Salut, une petite app pour dire bonjour dans toutes les langues, au bon moment de la journée."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23ffcd57'/%3E%3Ctext x='32' y='46' font-family='Georgia,serif' font-size='40' font-weight='bold' text-anchor='middle' fill='%2314152a'%3ES%3C/text%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="aurora" aria-hidden="true">
      <span class="blob blob-a"></span>
      <span class="blob blob-b"></span>
      <span class="blob blob-c"></span>
    </div>

    <main class="shell">
      <header class="topbar">
        <a class="brand" href="/" aria-label="Salut, accueil">
          <span class="brand-mark" aria-hidden="true">S</span>
          <span class="brand-name">Salut</span>
        </a>
        <p class="clock" id="clock" aria-live="off">--:--</p>
      </header>

      <section class="hero" aria-labelledby="greeting">
        <p class="eyebrow" id="date">—</p>
        <h1 class="greeting" id="greeting" lang="fr">Salut</h1>
        <p class="subline" id="subline">Comment tu t'appelles&nbsp;?</p>

        <form class="name-form" id="name-form" autocomplete="off">
          <label class="sr-only" for="name">Ton prénom</label>
          <input
            id="name"
            name="name"
            type="text"
            placeholder="Ton prénom…"
            maxlength="40"
            spellcheck="false"
            enterkeyhint="done"
          />
          <button type="submit" class="primary">Dire salut</button>
        </form>

        <div class="actions">
          <button type="button" class="ghost" id="copy">Copier la salutation</button>
          <button type="button" class="ghost" id="surprise">Surprends-moi</button>
        </div>
      </section>

      <section class="languages" aria-labelledby="languages-title">
        <h2 class="sr-only" id="languages-title">Choisir une langue</h2>
        <div class="chips" id="chips" role="group" aria-label="Langues"></div>
      </section>

      <footer class="footer">
        <p>Fait avec le soleil, la pluie et un peu de fromage.</p>
      </footer>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="app.js" defer></script>
  </body>
</html>
